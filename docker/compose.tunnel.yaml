# docker/compose.tunnel.yaml — Cloudflare Tunnel 前台（GH#861,Mac mini M4 用）
#
#   docker compose -f docker/compose.yaml -f docker/compose.family.yaml \
#     -f docker/compose.tunnel.yaml --env-file docker/.env up -d --scale caddy=0
#
# ⚠️ `--scale caddy=0`:走 tunnel 時 caddy **在這個組合裡**不該跑。
#    Cloudflare 已經在它的 edge 終結 TLS ⇒ 再讓 caddy 去要一次憑證是多餘的,
#    而它用的 HTTP-01/TLS-ALPN-01 需要 inbound 80/443 ⇒ 家用機沒有 ⇒ 失敗重試,
#    ⭐ 而 Let's Encrypt 的失敗**有速率限制** —— 撞到之後連正確設定也要等一週。
#
# ⭐⭐ **更正**（2026-08-29）:上面那句話一度寫成「caddy **必須**不跑」,而那太絕對。
#    caddy 用 **DNS-01**（Cloudflare API token）可以在**零 inbound** 的情況下拿到
#    `ggd.adms.ai` 的真憑證 —— DNS-01 是去改 TXT 記錄,⛔ 不需要任何人連得進來。
#    ⇒ 那正是「同一區網直連」那條快路需要的東西（valid HTTPS 而不是憑證警告）。
#    ⇒ 它住在 `compose.lan.yaml`,⛔ 不在這個檔裡 —— 因為它是**明確的選擇**。
#
# ═══ 這個檔為什麼存在 ═══
# 現況 ggd.adms.ai 的 A 記錄**直接**指 GCP 那台,憑證**簽在那台上**,前面零 CDN。
# 家用線路多數不會通:動態 IP／可能 CGNAT（＝**完全沒有 inbound**）／ISP 常擋 80·443。
# ⭐ 而它失敗的樣子是「**憑證續不了**」—— 三個月後才發作。
#
# Tunnel 是**純 outbound**:cloudflared 從家裡連出去,Cloudflare 在它的 edge 終結 TLS,
# ⇒ ⛔ 不需要固定 IP、⛔ 不需要埠轉發、⛔ 不需要路由器設定。
#
# ═══ 設定在哪（⭐ 刻意不在這個檔裡）═══
# token 型 tunnel 的路由住在 Cloudflare 後台:
#   Public hostname  ggd.adms.ai  →  Service  http://edge:8080
# ⭐ 這裡只放**連線**,⛔ 不放路由 —— 路由改了不必重新部署,而那正是 tunnel 的好處。
#
# ⚠️ WebSocket:Colyseus 走 WS,Cloudflare Tunnel **支援**,⛔ 不必額外開關。
#    但 ⭐ **要實測**,⛔ 不要因為文件說支援就當它通了（第二守則:量到再說）。
services:
  # ⛔⛔ 走 tunnel 時 edge **不需要發佈任何埠** —— 而預設它綁 0.0.0.0。
  #
  # `compose.family.yaml` 的 edge 是 `${GGD_BIND:-0.0.0.0}:${GGD_PORT:-8088}:8080`,
  # 而正式機的 docker/.env **沒有 GGD_BIND** ⇒ 出貨走的就是 0.0.0.0。
  # 在 GCP 上那沒問題:它在雲防火牆後面,只有 caddy 走得到。
  #
  # ⭐ 但 Mac mini **會跟著人換網路**（owner 2026-08-29:「有時候會放在同一個區網」）
  #   ⇒ 0.0.0.0 的意思是「**它加入的每一個網路**都看得到這個站」——
  #     咖啡廳、旅館、公司網段。⚠️ 而 family tier 是**刻意**沒有任何存取閘的
  #     （分級全開,見本檔開頭）⇒ 那個網段上的任何人都進得來。
  #
  # ⇒ cloudflared 與 edge 在**同一個 docker 網路**裡,它直接連 `edge:8080`,
  #   ⛔ 完全不需要 host 上的埠。⭐ 唯一的入口變成 Cloudflare,
  #   而那條路是 tunnel 自己認證的。
  #
  # ⚠️ 要在同一區網走直連的**快路**,⛔ 不要拿掉這一段 —— 用 compose.lan.yaml
  #   （它是**明確的選擇**,⛔ 不是預設）。
  edge:
    ports: !reset []

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ggd-cloudflared-1
    restart: unless-stopped
    # --no-autoupdate:⛔ 不要讓它在半夜自己換版本。版本升級是一次**部署**,
    #                 ⛔ 不是一個容器自己決定的事。
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in docker/.env（Cloudflare 後台 Tunnels → 建立 → 複製 token）}"
      # 指標埠:⭐ 讓「tunnel 活著嗎」變成一個問得到的問題,⛔ 不是看 log
      TUNNEL_METRICS: "0.0.0.0:2000"
    depends_on:
      - edge
    healthcheck:
      # ⭐ 驗的是「**它連上 Cloudflare 了嗎**」,⛔ 不是「process 還在嗎」——
      #   一個連不上的 cloudflared 會很開心地一直重試,而站是死的。
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
