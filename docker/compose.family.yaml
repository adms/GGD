# docker/compose.family.yaml — THE FAMILY DEPLOY OVERLAY (task #176).
#
#   docker compose -f docker/compose.yaml -f docker/compose.family.yaml \
#     --env-file docker/.env up --build -d
#
# or, the way the owner actually runs it:  make family-up
#
# WHAT THIS OVERLAY IS FOR
# ------------------------
# 「我只找家人玩，不用分級，請全開資源」— family only, no content tiering, serve
# every asset. This file is the ONLY place that opens the copyright gate, and it
# does it in four coordinated places, because opening any three of them produces
# a deploy that looks fine and is not:
#
#   1. GGD_DEPLOY_TIER=family        the declaration (logged by platform + game)
#   2. nginx/tier/family/ mounted    the serving gate (geo catch-all → lan)
#   3. VITE_GGD_FULL_ASSETS=1        the CLIENT BUILD — without this the bundle
#                                    never even REQUESTS the overlay, and 1+2+4
#                                    are dead weight. This is the one that gets
#                                    forgotten; see apps/client/src/config/fullAssets.ts.
#   4. data/blizzard-overlay mounted the 84 MB of bytes git cannot carry
#
# and the edge asserts 2+4 agree at boot (docker/edge-entrypoint.d/) so a
# half-configured deploy refuses to serve instead of quietly serving stand-ins.
#
# NETWORK EXPOSURE — READ BEFORE EDITING PORTS (#117)
# --------------------------------------------------
# The base compose pins EVERY published port to 127.0.0.1. Letting the family in
# means publishing exactly ONE port to the network, and the obvious way to do
# that — deleting the `127.0.0.1:` prefixes — would republish REDIS to the LAN
# at the same time. That is precisely #117: an orphaned redis exposing an
# un-authenticated admin session store to the whole network. So this file
# re-states the loopback pin on redis, platform and game EXPLICITLY, and opens
# only `edge`. If you need to change exposure, change it here, and change only
# the edge entry.
#
# TLS: none. The edge speaks plain HTTP. Put it behind a tunnel that terminates
# TLS (cloudflared / tailscale funnel / ssh -R) or keep it on the LAN. Family
# passwords travel over that hop.

name: ggd

services:
  redis:
    # EXPLICIT re-pin. Do not remove. See the exposure note above (#117).
    ports:
      - "127.0.0.1:6379:6379"
    # A redis crash drops the session store and logs everyone out; bring it back
    # automatically for the evening. (edge is the ONLY service left on "no", by
    # design — see its block.)
    restart: unless-stopped

  platform:
    # Auto-recover from a crash so a mid-evening blip doesn't strand the family
    # at the login wall. `unless-stopped` keeps it down after `make family-down`.
    restart: unless-stopped
    environment:
      # --- the declaration -------------------------------------------------
      GGD_DEPLOY_TIER: "family"
      APP_ENV: production
      # --- registration posture (the invite gate is #174's; we only declare) --
      # The address heuristic in config.go cannot see a reverse proxy in front
      # of a loopback-bound platform, and the author says so at config.go's
      # resolveRequireInvite. A deploy the family reaches must say it out loud.
      GGD_REQUIRE_INVITE: "1"
      GGD_REQUIRE_APPROVAL: "1"
      # --- first-owner claim ------------------------------------------------
      # Without this the first registration on a fresh data/ is an open
      # footrace on a public endpoint. With it the platform mints a one-time
      # token at /data/owner-setup-token (0600) and only a registration
      # presenting that token may claim ownership:
      #   docker compose exec platform cat /data/owner-setup-token
      GGD_OWNER_BOOTSTRAP_TOKEN: "1"
    ports:
      - "127.0.0.1:8080:8080"

  game:
    # Auto-recover from a crash — a dead game server strands every family member
    # at champ-select/in-match with no way to start or finish a round.
    restart: unless-stopped
    environment:
      GGD_DEPLOY_TIER: "family"
      # Match replay recording (#175) is the whole POINT of the family playtest —
      # the feedback channel. The recorder writes to GGD_REPLAY_DIR (else
      # <repo>/data/replays, which in this image resolves to a NON-writable /data
      # and made every match fail to record with a silent EACCES). Point it at the
      # writable bind mount below so replays actually land and survive restarts.
      GGD_REPLAY_DIR: /data/replays
      # NOT development. The base compose sets NODE_ENV=development, which made
      # apps/game-server/src/config/secretGuard.ts inert on the one deploy path
      # that matters and left match/cheatGate.ts relying on a non-empty secret
      # alone. #176 inverted that guard's polarity; this makes the intent
      # explicit on both variables.
      APP_ENV: production
      NODE_ENV: production
    ports:
      - "127.0.0.1:2567:2567"
    volumes:
      # Writable replay sink (see GGD_REPLAY_DIR above). Host-side data/replays so
      # the owner can pull .jsonl.gz recordings off the box after the evening.
      - ../data/replays:/data/replays

  edge:
    build:
      context: ..
      dockerfile: docker/edge.Dockerfile
      args:
        # THE ONE THAT DECIDES THE OUTCOME. See the header, item 3.
        VITE_GGD_FULL_ASSETS: "1"
        # Build identity (task #66 / P0-6(a)). compose merges `args` MAPS
        # key-wise (unlike `ports`, a sequence, which needed `!override`), so
        # the base file's value would already carry — it is restated because
        # this is the file the family deploy is read from, and a stamp that is
        # present in one build path and absent in another is precisely the shape
        # of the defect being fixed. `make family-up` exports the value.
        GGD_BUILD_STAMP: "${GGD_BUILD_STAMP:-}"
    # THE ONLY PORT REACHABLE FROM THE NETWORK.
    # GGD_BIND=127.0.0.1 keeps it local; 0.0.0.0 opens it to the LAN/tunnel.
    #
    # `!override` REPLACES the base list rather than appending to it. Compose
    # merges `ports` additively, so without this the base compose's
    # `127.0.0.1:8088:8080` and this `0.0.0.0:8088:8080` would BOTH be published
    # on host port 8088 — two bind attempts on the same port, and the edge fails
    # to start with "address already in use". The override collapses it to the
    # single family mapping.
    ports: !override
      - "${GGD_BIND:-0.0.0.0}:${GGD_PORT:-8088}:8080"
    volumes:
      - ../content:/srv/content:ro
      # The family tier's nginx fragments: a geo catch-all that reclassifies
      # every peer into the served tier, plus the blizzard-local location.
      # Mounting this directory IS the tier switch; omit it and the edge is
      # gated exactly as before.
      - ../nginx/tier/family:/etc/nginx/ggd-tier:ro
      # The 84 MB git cannot carry. On a REMOTE host this path is whatever
      # `make family-ship HOST=…` rsynced to; override with GGD_OVERLAY_SRC.
      - ${GGD_OVERLAY_SRC:-../data/blizzard-overlay}:/srv/blizzard-overlay:ro
    # DO NOT change to `unless-stopped`. The boot assertion exits 1 when the
    # overlay is missing or short; a restart policy would turn that single loud
    # failure into a crash-loop nobody reads, which is the silent-degradation
    # failure mode this whole task exists to remove.
    restart: "no"
