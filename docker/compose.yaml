# docker/compose.yaml — lightest inner dev loop (no k8s): redis + platform +
# game + edge with live ./content and ./data bind mounts.
#
#   docker compose -f docker/compose.yaml up --build
#   docker compose -f docker/compose.yaml --profile dev up   # + content-api
#
# CONTRACT NOTE: apps/{platform,game-server,client,editor,content-api} are
# being built in parallel; their image builds will succeed once those packages
# land. Until then you can bring up subsets, e.g.:
#   docker compose -f docker/compose.yaml up redis
#
# Secrets are injected via env (never baked into images) and are REQUIRED: each
# uses the ${VAR:?...} fail-fast form, so `docker compose ... up|config` errors
# immediately if a value is unset instead of silently booting on a guessable
# default. Provide them in a .env file next to this compose file (gitignored via
# the root .gitignore `.env` rule); copy docker/.env.example and fill it, e.g.
#   REDIS_PASSWORD=$(openssl rand -hex 32)

name: ggd

services:
  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--appendfsync", "everysec",
        "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  platform:
    build:
      context: ..
      dockerfile: docker/platform.Dockerfile
    environment:
      APP_ENV: development
      # ENV NAME FIXES (#176). The three below were set under names the Go
      # config NEVER READS, so each silently fell back to a default:
      #   HTTP_ADDR        → config reads PLATFORM_ADDR (default ":8080" — the
      #                      default happened to match, so this one was harmless)
      #   GAME_INTERNAL_URL→ config reads GAME_SERVER_ADDR (default
      #                      "http://127.0.0.1:2567", which INSIDE the platform
      #                      container is the platform itself — not the game)
      # The old names are kept below, commented, so a search for them lands here
      # rather than on nothing.
      PLATFORM_ADDR: ":8080"
      HTTP_ADDR: ":8080" # legacy alias, read by nothing — see above
      GAME_SERVER_ADDR: "http://game:2567"
      PLATFORM_INTERNAL_URL: "http://platform:8080"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}"
      DATA_DIR: /data
      CONTENT_DIR: /srv/content
      JWT_SIGNING_SECRET: "${JWT_SIGNING_SECRET:?set JWT_SIGNING_SECRET in docker/.env}"
      PLATFORM_GAME_SHARED_SECRET: "${PLATFORM_GAME_SHARED_SECRET:?set PLATFORM_GAME_SHARED_SECRET in docker/.env}"
      GAME_INTERNAL_URL: "http://game:2567" # legacy alias, read by nothing
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # durable truth — survives container restarts, lives in the repo
      - ../data:/data
      - ../content:/srv/content:ro
    depends_on:
      redis:
        condition: service_healthy

  game:
    build:
      context: ..
      dockerfile: docker/game.Dockerfile
    environment:
      NODE_ENV: development
      PORT: "2567"
      PLATFORM_GAME_SHARED_SECRET: "${PLATFORM_GAME_SHARED_SECRET:?set PLATFORM_GAME_SHARED_SECRET in docker/.env}"
      CONTENT_DIR: /srv/content
      # Task #48. Where the game-server fetches curation / combat-env /
      # server-ops. It was NEVER set here, and the code's non-k8s default is
      # http://localhost:8080 — which inside this container is the GAME itself,
      # not the platform. Unset, every compose match silently ran on allow-all
      # curation and untuned combat multipliers. `platform` is the compose
      # service name on the shared default network.
      GGD_PLATFORM_URL: "http://platform:8080"
    ports:
      - "127.0.0.1:2567:2567"
    volumes:
      - ../content:/srv/content:ro

  edge:
    build:
      context: ..
      dockerfile: docker/edge.Dockerfile
      args:
        # BUILD IDENTITY (task #66, defect P0-6(a)). The image has no .git and
        # no git binary, so the stamp can only come from the host. `make
        # family-up` / `make up` export GGD_BUILD_STAMP; a bare
        # `docker compose build` leaves it empty and the badge then reads
        # UNSTAMPED-BUILD — loudly wrong, instead of the old plausible "dev".
        # To stamp a hand-rolled build:
        #   GGD_BUILD_STAMP="$(git rev-parse --short HEAD) $(date -u +%F)" \
        #     docker compose -f docker/compose.yaml build edge
        GGD_BUILD_STAMP: "${GGD_BUILD_STAMP:-}"
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ../content:/srv/content:ro
    depends_on:
      - platform
      - game

  # dev profile only: content CRUD/validate/SSE (RW mount!)
  content-api:
    profiles: ["dev"]
    build:
      context: ..
      dockerfile: docker/content-api.Dockerfile
    environment:
      APP_ENV: development
      CONTENT_DIR: /srv/content
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ../content:/srv/content

volumes:
  redis-data:
