# docker/compose.lan.yaml — 同一區網的**直連快路**（GH#861）
#
#   GGD_LAN_BIND=192.168.0.42 \
#   docker compose -f docker/compose.yaml -f docker/compose.family.yaml \
#     -f docker/compose.tunnel.yaml -f docker/compose.lan.yaml \
#     --env-file docker/.env up -d --scale caddy=0
#
#   同一區網的人連 http://192.168.0.42:8088  ← ⭐ 不經過網際網路
#   其他人照常連 https://ggd.adms.ai         ← 走 tunnel
#
# ═══ 為什麼它是**獨立的一個檔**,⛔ 不是預設 ═══
# owner 2026-08-29:「這台 mac mini **有時候**會放在同一個區網 (maybe 192.168.0.x)」
#
# ⭐ 關鍵字是「**有時候**」—— 這台機器**會換網路**。
#   （實測:owner 的另一台 Mac 在 172.16.0.x,而他說 mini 會在 192.168.0.x
#     ⇒ 至少兩個不同網段。）
#
# ⛔ 而 family tier 是**刻意**沒有任何存取閘的（分級全開,見 compose.family.yaml 開頭）
#   ⇒ 把站開在「它剛好加入的那個網路」上,等於開給咖啡廳/旅館/公司網段的每一個人。
#   ⇒ ⭐ 所以這一格必須是一次**明確的動作**,⛔ 不可以是預設,
#     ⛔ 也不可以「偵測到像家裡就自動打開」—— 那種猜法錯的時候代價太大。
#
# ═══ GGD_LAN_BIND 沒有預設值,這是刻意的 ═══
# ⛔ 沒有 `:-0.0.0.0`。你必須寫出**那一張網卡的 IP**。
# ⭐ 理由:`0.0.0.0` 的意思是「**現在與未來**加入的每一個網路」,
#   而綁定一個具體的 192.168.0.x,在機器換到別的網段之後**會直接綁不起來**
#   ⇒ ⭐ 它**主動失敗**,⛔ 而不是安靜地把站開給新網段。
#   那個「換了網段就起不來」正是我們要的行為,⛔ 不是缺點。
#
# ═══ ⚠️ 這條路是**純 HTTP**,而那是一個被講清楚的取捨 ═══
# LAN 上不做 TLS ⇒ 同一區網的人**看得到流量**（含登入 token）。
# ⭐ 可行的理由是量過的:客戶端**沒有**硬性 secure-context 需求 ——
#   `apps/client/src/render/textureDedup.ts:158` 逐字寫著它**刻意不用** `crypto.subtle`
#   「因為它只在 secure context 可用」⇒ 純 HTTP 下功能是完整的。
# ⛔ 但這表示:**只在你信任的網段上打開它。**
#
# ═══ ⛔⛔ 量過了,而結論是「**不要開**」（2026-08-29）═══
#
# 從 owner 的 Mac（與 mini 同網段）實測,同一個視角量三個:
#
#     LAN 直連            6.51 ms
#     最近的 CF edge      7.62 ms
#     今天的 ggd.adms.ai  9.84 ms   ← GCP 台灣,現況
#
# ⇒ tunnel 路徑 = client→CF ＋ CF→mini。⭐ 而 mini 與 client **在同一個網段**
#   ⇒ 兩段都經過同一條家用上行 ⇒ **那條上行被算兩次** ≈ 15.2 ms。
#
#     這條快路省下的 = 15.2 − 6.51 = **8.7 ms**
#
# ⭐ 而門檻是 15 ms（見 mac-mini-preflight.sh 的 C-LAN 段）⇒ **8.7 < 15 ⇒ 不做。**
#   多一條路 ＝ 多一份會漂掉的設定,而且它**只在 mini 在家時**有效
#   （owner:「有時候會放在同一個區網」）。8.7 ms 買不到那個複雜度。
#
# ⚠️ 一個誠實的但書:**6.51 ms 對 LAN 來說偏高**（有線通常 <1 ms）——
#   那是 Wi-Fi。插網路線後差距會變成 ~14 ms,**仍在門檻邊緣**,判斷不變。
#
# ⇒ ⭐ 這個檔**留著但不使用**:它是一個量過、有出處、被否決的選項,
#   ⛔ 不是一個「可以試試看」的開關。要翻案請先重跑那三個量測,
#   ⛔ 不要因為「同區網當然比較快」就打開它 —— 那正是這一段存在的理由。
#
# ⚠️ 順帶量到的、**與這個決定無關但更重要**的一件事:
#   搬到 mini + tunnel 之後是 15.2 ms,而今天是 9.84 ms ⇒ **搬遷的真實代價是 +5.4 ms**。
#   對 33 ms 的預算來說很寬 ⇒ ⭐ 搬遷本身沒有延遲問題。
services:
  edge:
    # `!override` 是必要的:compose.tunnel.yaml 用 `!reset []` 把 ports 清空了,
    # 而 list 的預設語意是合併 ⇒ 不 override 的話這裡會變成「空 + 這一條」的混合。
    ports: !override
      - "${GGD_LAN_BIND:?⛔ 必須寫出網卡 IP，例如 GGD_LAN_BIND=192.168.0.42。⛔ 不要填 0.0.0.0 —— 那會把站開給這台機器未來加入的每一個網路}:${GGD_LAN_PORT:-8088}:8080"
