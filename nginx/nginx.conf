# nginx/nginx.conf — GGD edge reverse proxy + static server.
#
# Written for nginxinc/nginx-unprivileged:alpine (runs as uid 101, listens on
# 8080, pid/temp under /tmp). Baked into docker/edge.Dockerfile and ALSO shipped
# as a Helm ConfigMap (deploy/helm/ggd/files/nginx.conf — keep the copy in
# sync; this file is the source of truth).
#
# Routing contract (plan §5 "Infra & one-click K8s"):
#   /            → client SPA static           (baked into the edge image)
#   /editor/     → editor SPA static           (baked into the edge image)
#   /admin/      → operations admin console static (baked into the edge image)
#                  — OPERATOR tool: IP-allowlist / basic-auth in real prod
#                  via an include dropped into /etc/nginx/ggd-admin/ (glob below)
#   /content/**  → static game content JSON/.glb from /srv/content (RO mount);
#                  `?h=<hash>` → immutable cache; manifest.json/_index.json → no-cache
#   /api/**      → Go platform  (platform:8080)  — incl. lobby WS at /api/v1/lobby/ws
#                  EXCEPT /api/v1/internal/** which is denied here (in-cluster
#                  only: the game→platform result callback); auth login/register
#                  are per-IP rate-limited
#   /colyseus/,
#   /ws/         → Colyseus game server (game:2567) — WebSocket upgrade, 1 h timeouts
#   /content-api/→ dev-only Fastify content-api (content-api:8787) — the location
#                  lives in nginx/dev/content-api.conf, mounted at
#                  /etc/nginx/ggd-dev/ ONLY in the dev profile. The glob include
#                  below matches nothing in prod, so the route does not exist there.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

# ---- optional dynamic modules (MAIN context — load_module is only legal here) -
# Matches NOTHING in the stock image: nginxinc/nginx-unprivileged:alpine is built
# without ngx_brotli and ships no brotli .so (verified: `nginx -V | grep brotli`
# → no match; /usr/lib/nginx/modules holds only geoip/image_filter/js/xslt).
# A brotli-enabled image drops a one-line `load_module` file in here.
# docker/edge-brotli.Dockerfile builds exactly that image and it was verified
# live (see nginx/brotli/README.md): THIS config file loads unchanged on both,
# and on the brotli image a .glb comes back `Content-Encoding: br` and decodes
# byte-identical. On the STOCK image the glob matches nothing, so brotli is OFF
# — stated plainly here rather than pretended.
include /etc/nginx/ggd-modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    # Extensions the stock mime.types does NOT know. Without these they fall
    # through to `default_type application/octet-stream`, which is deliberately
    # NOT in gzip_types (it is the catch-all for every unknown binary) — so
    # every .glb and .wav shipped UNCOMPRESSED. This block MERGES with the
    # include above (verified in the real image: json/js/css/svg/png/mp3 all
    # still resolve). Adding octet-stream to gzip_types instead would be the
    # tempting shortcut and is wrong: it would burn CPU gzipping mp3 and png.
    types {
        model/gltf-binary          glb;
        model/gltf+json            gltf;
        audio/wav                  wav;
        # The PWA manifest. apps/client/index.html:11 links
        # /manifest.webmanifest, stock mime.types has no `webmanifest` entry,
        # so it was served as application/octet-stream and UNCOMPRESSED —
        # exactly the bug the .glb entry above fixes. Measured on the real
        # apps/client/dist/manifest.webmanifest: 530 B, previously
        # `Content-Type: application/octet-stream`, no `Content-Encoding`.
        # `application/manifest+json` is already listed in gzip_types below;
        # without THIS line that entry could never match anything.
        application/manifest+json  webmanifest;
    }
    default_type application/octet-stream;

    # nginx-unprivileged: all scratch paths must be writable by uid 101.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    server_tokens off;

    # ---- edge abuse limits ---------------------------------------------------
    # Cap request bodies: auth/API payloads are small JSON, content is GET-only.
    client_max_body_size 1m;

    # Per-IP WebSocket connection cap → bounds idle-WS file-descriptor pressure
    # on the edge. Applied on /colyseus and /ws below. Conservative default;
    # raise it if you front many users behind a shared NAT/egress IP.
    limit_conn_zone $binary_remote_addr zone=wsconn:10m;
    limit_conn_status 429;

    # Per-IP request rate for auth endpoints → slows credential stuffing / brute
    # force. Applied on the exact /api/v1/auth/{login,register} paths below.
    # (The platform also rate-limits these; this is the edge layer.)
    limit_req_zone $binary_remote_addr zone=authlogin:10m rate=10r/m;
    limit_req_status 429;

    # ---- compression ---------------------------------------------------------
    # MEASURED on this repo, snapshot 2026-07-23 (see nginx/brotli/README.md):
    #   .glb  163 files  36,525,948 B → 19,518,292 B at gzip -9  (-46.6 %, -17.0 MB)
    #   .wav   50 files   2,560,838 B →  1,877,542 B at gzip -9  (-26.7 %)
    # Both were shipping COMPLETELY UNCOMPRESSED before, because neither
    # extension is in the image's mime.types (see the `types` block above).
    # DELIBERATELY ABSENT — already-compressed containers, measured on 200-file
    # samples: mp3 19,485,036 → 19,289,102 (-1.005 %), png 11,929,063 →
    # 11,883,350 (-0.383 %, and one PNG actually GREW 69,974 → 70,030), webp
    # likewise. Compressing those is pure CPU for nothing, so audio/mpeg,
    # image/png and image/webp are intentionally not listed.
    gzip on;
    gzip_comp_level 5;
    # 256, not the old 1024. MEASURED over the 1,463 non-asset content JSON docs:
    # 988 of them are under 1024 B and so were shipping RAW. Whole-set transfer
    # 1,388,663 B before → 1,137,625 B at this threshold (-18.1 %). Below 256 B
    # it stops paying: the docs under 256 B only go 3,924 → 3,704 and 9 of them
    # come out BIGGER than the original, so 256 is the floor, not 0.
    gzip_min_length 256;
    gzip_vary on;
    gzip_types
        application/json
        application/javascript
        text/javascript
        application/wasm
        application/manifest+json
        text/css
        text/plain
        image/svg+xml
        model/gltf-binary
        model/gltf+json
        audio/wav;

    # gzip_static is NOT enabled here at http level — see the `location /`,
    # `location /editor/` and `location /admin/` blocks below, which are the
    # only three trees whose `.gz` sidecars are built INSIDE the image by
    # docker/edge.Dockerfile. Rationale is in those blocks; the short version is
    # that gzip_static trusts a sidecar it cannot verify, and /srv/content is a
    # read-only runtime mount that no build step sweeps.

    # brotli, when the image has the module. Empty in the stock image (the glob
    # matches nothing) — see the ggd-modules include at the top of this file and
    # nginx/brotli/README.md. The .br sidecars are emitted regardless, so
    # switching images is the only step needed to activate them.
    include /etc/nginx/ggd-brotli/*.conf;

    # Content cache policy: a `?h=<contenthash>` URL is immutable by
    # construction (hash-addressed), everything else must revalidate.
    map $arg_h $content_cache {
        ""      "no-cache";
        default "public, max-age=31536000, immutable";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # ---- COPYRIGHT / ENVIRONMENT-TIER GATE (task #127) -----------------------
    # Classify the SOCKET PEER ($remote_addr — never a forwarded header, which
    # the caller writes and can forge) into an environment tier, and DENY the
    # copyright-restricted / single-player mounts to a genuinely public peer.
    # loopback + LAN (a phone on the same wifi) are served exactly as before.
    # The vite dev middleware applies the identical rule (apps/client/
    # vite.config.ts → @ggd/shared/envTier); this `geo` block is the second,
    # independent expression of that one table (see docs/copyright-content-gate.md).
    #
    # `geo` (unlike `map`) matches CIDR blocks natively and defaults its source
    # to $remote_addr. The tiers mirror packages/shared/src/envTier.ts exactly.
    #
    # DOCUMENTED CAVEAT: $remote_addr is the IMMEDIATE peer. Front this edge with
    # a cloud load-balancer and $remote_addr becomes the LB (often a 10./172.
    # private address → classified "lan"), so a real public deploy behind an LB
    # must ALSO keep the restricted assets out of the image — blizzard-local
    # already is, by construction (nginx/dev/*, data/ never COPYd), and a public
    # image should omit content/assets/models/imported/. This gate is EXACT when
    # nginx itself is the internet-facing hop (the docker / LAN edge).
    geo $ggd_env_tier {
        default        public;
        127.0.0.0/8    loopback;
        ::1/128        loopback;
        10.0.0.0/8     lan;
        172.16.0.0/12  lan;
        192.168.0.0/16 lan;
        169.254.0.0/16 lan;   # IPv4 link-local
        fc00::/7       lan;    # IPv6 unique-local
        fe80::/10      lan;    # IPv6 link-local

        # ---- FAMILY TIER OPT-IN (task #176) ------------------------------
        # The ONE hook that turns this edge into a full-asset deploy. Empty by
        # default: the glob matches nothing here, in the dev layout, in the
        # prod image and in the Helm chart, so every deploy that does not
        # deliberately opt in behaves exactly as it did before #176.
        #
        # A family deploy bind-mounts nginx/tier/family/ over
        # /etc/nginx/ggd-tier/. That directory contains a single geo fragment
        # (`0.0.0.0/0 lan; ::/0 lan;`) which reclassifies every peer into the
        # served tier, plus a *.server.conf that adds the blizzard-local
        # location (picked up by the matching include in the server block).
        # One mount flips the tier; FORGETTING THE MOUNT FAILS SAFE, because
        # an empty glob leaves this geo exactly as written above.
        #
        # `include` inside `geo` is the documented way to add address→value
        # entries, and it is used here rather than a second `map` for
        # $ggd_deny_copyright because nginx rejects a duplicate map for the
        # same variable — an override would have to MOVE the map out of this
        # file, which would make nginx.conf no longer valid on its own (the
        # infracheck suite mounts exactly this one file and runs `nginx -t`).
        # More-specific prefixes still win, so the loopback/LAN rows above are
        # unaffected; only "everything else" moves from public to lan.
        include /etc/nginx/ggd-tier/*.geo.conf;
    }
    map $ggd_env_tier $ggd_deny_copyright {
        public  1;
        default 0;
    }

    upstream platform {
        server platform:8080;
    }

    upstream game {
        server game:2567;
    }

    server {
        listen 8080;
        server_name _;

        # Security headers (locations that declare their own add_header
        # re-declare these — nginx add_header does not merge across levels).
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "same-origin" always;
        # HSTS. TLS is terminated UPSTREAM of this edge (ingress / load balancer)
        # — the edge itself speaks plain HTTP on :8080 — so the AUTHORITATIVE
        # place for this header is that TLS terminator, which must set it on the
        # public HTTPS responses. It is declared here too (harmless: browsers
        # ignore HSTS received over plain HTTP) so the guarantee still travels
        # with the app if the edge is ever the TLS-terminating hop.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        root /usr/share/nginx/html/client;
        index index.html;

        # ---- client SPA -----------------------------------------------------
        # gzip_static SCOPE (deliberate, do not hoist back to http level):
        # gzip_static serves `<file>.gz` on trust — it never checks that the
        # sidecar is NEWER than, or even that its source still EXISTS. Measured
        # on the real image: with `a.glb` rewritten after `a.glb.gz` was made,
        # a gzip client got the OLD bytes and an identity client got the NEW
        # ones, 200 both times, ETag/Last-Modified taken from the .gz so it
        # looks fresh; with `a.glb` deleted and `a.glb.gz` left behind, a gzip
        # client got 200 + the deleted model while identity got 404.
        # These three SPA trees are SAFE because their sidecars are generated
        # from scratch inside a fresh image layer on every build
        # (docker/edge.Dockerfile runs nginx/precompress.sh over the dists), so
        # a stale or orphaned sidecar cannot survive a deploy.
        # /content/ is NOT safe that way — it is a read-only runtime mount that
        # no build step sweeps, and the model tree is actively churning — so it
        # keeps runtime gzip, where the win already is (measured: content bundle
        # 1,388,663 → 1,137,625 B at runtime gzip -5; sidecars would reach
        # 1,117,448, a 1.8 % delta not worth serving deleted assets for).
        location / {
            gzip_static on;
            try_files $uri $uri/ /index.html;
        }

        # ---- sub-app entry points, WITHOUT the trailing slash ---------------
        # `location /admin/` matches only URIs that BEGIN with "/admin/". A
        # request for "/admin" does not match it, falls through to `location /`
        # above, and `try_files $uri $uri/ /index.html` cannot find "admin"
        # under the CLIENT root — so it serves the GAME's index.html.
        #
        # MEASURED on the live host before this fix:
        #   /admin   → 200, 2087 B, byte-identical to /   (the game lobby)
        #   /admin/  → 200,  672 B, GGD Operations Console
        # with NO redirect on either.
        #
        # nginx normally issues its own 301 from /dir to /dir/, but only inside
        # a location whose root actually contains that directory; `location /`
        # is rooted at the client dist, where `admin/` does not exist. So the
        # redirect has to be written.
        #
        # This cost the owner three separate reports of 「不是真正的後台畫面」,
        # each one verified against the trailing-slash form and each one wrongly
        # answered "it works" — the URL a human types is the one that must be
        # tested. Exact-match (`= `) so it cannot shadow the prefix blocks.
        # `absolute_redirect off` is NOT optional here. Without it nginx expands a
        # relative `return 301 /admin/` into `$scheme://$host:$server_port/admin/`
        # using ITS OWN listener — and this server listens on 8080 behind Caddy,
        # which terminates TLS on 443. The first deploy of this fix emitted
        # `http://ggd.adms.ai:8080/admin/`: wrong scheme, wrong port, dead link.
        # That was worse than the bug it replaced, which at least served a page.
        # Off = send the Location header exactly as written, and let the browser
        # resolve it against whatever origin it actually used.
        absolute_redirect off;
        location = /admin  { return 301 /admin/; }
        location = /editor { return 301 /editor/; }

        # ---- editor SPA -----------------------------------------------------
        # root-based so /editor/x → /usr/share/nginx/html/editor/x
        location /editor/ {
            root /usr/share/nginx/html;
            gzip_static on;   # baked sidecars — see the scope note on `location /`
            try_files $uri $uri/ /editor/index.html;
        }

        # ---- operations admin console (OPERATOR TOOL) -----------------------
        # Static admin SPA, baked into the edge image like client/editor.
        # SECURITY: the admin console is an operator surface. In real
        # production it MUST be protected — IP-allowlist it at the LB/ingress
        # and/or drop a basic-auth include into /etc/nginx/ggd-admin/ (the glob
        # below). The glob matches NOTHING by default (dir absent locally and
        # in the dev/prod charts), so the console stays reachable for local
        # development; a production overlay adds the protection file. An
        # example include ships at nginx/admin/basic-auth.conf.example.
        location /admin/ {
            root /usr/share/nginx/html;
            gzip_static on;   # baked sidecars — see the scope note on `location /`
            include /etc/nginx/ggd-admin/*.conf;   # optional: auth_basic / allow-deny (absent by default)
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
            add_header Referrer-Policy "same-origin" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            try_files $uri $uri/ /admin/index.html;
        }

        # ---- game content (RO) ---------------------------------------------
        # root /srv so /content/x → /srv/content/x
        location = /content/manifest.json {
            root /srv;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        location ~ ^/content/.*_index\.json$ {
            root /srv;
            # HEAD carries NO BODY, so compressing it buys nothing and costs the
            # one header a HEAD exists to deliver. MEASURED on the stock image:
            # `HEAD /content/x.glb` with `Accept-Encoding: gzip` came back with
            # `Content-Encoding: gzip` and NO `Content-Length` at all (nginx's
            # gzip header filter clears it, since it cannot know the compressed
            # size without producing the body). That silently broke the asset
            # budget page's staleness guard
            # (apps/client/public/model-budget.html `headLen`), which HEADs all
            # 166 shipping assets and compares Content-Length against the bytes
            # the report recorded: every target became "unverifiable" and the
            # page could no longer tell the owner its numbers had gone stale.
            # Turning gzip off for HEAD restores the identity Content-Length and
            # changes nothing about GET (verified: GET still returns
            # `Content-Encoding: gzip` and the body decodes byte-identical).
            # `if` is safe here for the same reason it is in the copyright gate
            # below: one config-setting directive, no rewrite, no try_files.
            if ($request_method = HEAD) { gzip off; }
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        # ---- copyright-restricted imported champion models (task #127) -------
        # The imported/anime champion GLBs sit inside the deployable content
        # tree, so the generic /content/ location below would otherwise serve
        # them to anyone. `^~` makes this the longest-matching prefix (wins over
        # /content/ and skips the regex locations for these URLs). A public peer
        # gets 403; loopback + LAN are served with the normal cache rule.
        # (`if (...) { return ... }` is the sanctioned, non-"evil" use of if.)
        location ^~ /content/assets/models/imported/ {
            if ($ggd_deny_copyright) { return 403; }
            # identity length for HEAD — see the _index.json location above.
            # 129 of the budget page's 166 freshness targets live under here.
            if ($request_method = HEAD) { gzip off; }
            root /srv;
            add_header Cache-Control $content_cache always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }
        location /content/ {
            root /srv;
            # identity length for HEAD — see the _index.json location above.
            # NOTE there is deliberately no `gzip_static on` here: /srv/content
            # is a read-only runtime mount with no sidecar sweep, so a stale or
            # orphaned .gz would be served forever. See `location /`.
            if ($request_method = HEAD) { gzip off; }
            add_header Cache-Control $content_cache always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ---- internal server-to-server API: NEVER exposed at the edge --------
        # /api/v1/internal/** is the in-cluster-only surface the game server
        # calls back on (e.g. the match-result callback
        # /api/v1/internal/matches/{id}/result). The generic /api/ proxy below
        # would otherwise forward it straight to the public internet. This
        # longer-prefix location wins over /api/ (nginx longest-prefix match)
        # regardless of file order and hard-blocks it. The chart's
        # networkpolicy.yaml is the in-cluster complement; the platform's HMAC
        # on this route is defense in depth.
        location /api/v1/internal/ {
            deny all;
            return 404;
        }

        # ---- auth endpoints: per-IP rate limit (brute force / stuffing) ------
        # Exact-match locations take priority over the /api/ prefix. They carry
        # the same proxy headers as /api/ (minus the WS upgrade / long timeouts,
        # which login/register POSTs don't need) plus the limit_req gate.
        location = /api/v1/auth/login {
            limit_req zone=authlogin burst=5 nodelay;
            proxy_pass http://platform;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /api/v1/auth/register {
            limit_req zone=authlogin burst=5 nodelay;
            proxy_pass http://platform;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- #243 平台資料搬遷 ------------------------------------------------
        # THE ONLY route allowed a large request body. EXACT match (`=`), which
        # in nginx's location ordering beats the `/api/` prefix below — so this
        # affects this one path and nothing else under /api/.
        #
        # WITHOUT THIS BLOCK EVERY IMPORT 413s AT THE EDGE and never reaches the
        # platform, with no explanation on either side: the server-level
        # `client_max_body_size 1m` above answers first. The platform has a
        # MATCHING per-path exemption (server.maxArchiveUploadBytes); both are
        # required, and both are 512 MiB.
        location = /api/v1/admin/platform-archive/stage {
            client_max_body_size 512m;
            client_body_timeout  600s;
            # Stream straight through to the platform instead of buffering a
            # complete copy of a credential-bearing archive at the edge.
            proxy_request_buffering off;
            proxy_read_timeout   600s;
            proxy_send_timeout   600s;
            proxy_pass http://platform;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # The export response is produced on the fly and can be tens of MB, so
        # response buffering is off here too — otherwise the edge lands the
        # whole ZIP before sending a byte.
        location = /api/v1/admin/platform-archive/export {
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_pass http://platform;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- Go platform API (+ lobby WebSocket) ----------------------------
        location /api/ {
            proxy_pass http://platform;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # the lobby WS lives under /api/v1/lobby/ws
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # ---- Colyseus game server (WebSocket) --------------------------------
        location /colyseus/ {
            limit_conn wsconn 20;
            proxy_pass http://game;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
        location /ws/ {
            limit_conn wsconn 20;
            proxy_pass http://game;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # ---- dev-only routes -------------------------------------------------
        # /content-api/ lives in nginx/dev/content-api.conf. The Helm chart (and
        # docker compose dev profile) mount that file into /etc/nginx/ggd-dev/
        # ONLY when dev.enabled=true; in prod this glob matches nothing and the
        # route simply does not exist (infra-05).
        include /etc/nginx/ggd-dev/*.conf;

        # ---- family full-asset tier (task #176) ------------------------------
        # Server-level half of the /etc/nginx/ggd-tier/ opt-in described at the
        # `geo $ggd_env_tier` block above: nginx/tier/family/*.server.conf adds
        # the /content/assets/blizzard-local/ location backed by the mounted
        # data/blizzard-overlay. Matches nothing unless the family tier
        # directory is mounted, so the prod image and the Helm chart are
        # unchanged. The two globs are distinct (*.geo.conf vs *.server.conf)
        # so ONE mounted directory feeds both contexts.
        include /etc/nginx/ggd-tier/*.server.conf;

        # ---- edge health -----------------------------------------------------
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
