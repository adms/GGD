# nginx/brotli/http/brotli.conf — http-context drop-in, mounted at
# /etc/nginx/ggd-brotli/ by an image that has ngx_brotli loaded (see
# ../modules/brotli-load.conf and ../README.md).
#
# Same type list as gzip_types in nginx/nginx.conf, for the same measured
# reasons: mp3 / png / webp are already-compressed containers and are excluded.
# (brotli_types, like gzip_types, always includes text/html implicitly.)

brotli_static on;   # serve <file>.br sidecars — zero runtime CPU, quality 11
brotli on;          # and compress on the fly when no sidecar exists
brotli_comp_level 5;  # runtime level: ~= gzip -9 ratio at comparable CPU
brotli_min_length 256;
brotli_types
    application/json
    application/javascript
    text/javascript
    application/wasm
    application/manifest+json
    text/css
    text/plain
    image/svg+xml
    model/gltf-binary
    model/gltf+json
    audio/wav;
