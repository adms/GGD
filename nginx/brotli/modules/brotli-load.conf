# nginx/brotli/modules/brotli-load.conf — MAIN-context drop-in.
#
# Mount/COPY this file to /etc/nginx/ggd-modules/ ONLY in an image that actually
# contains the two ngx_brotli .so files (docker/edge-brotli.Dockerfile builds
# one). In the stock nginxinc/nginx-unprivileged:alpine image these modules do
# not exist and nginx would refuse to start.
#
# `load_module` is legal only in the main context, which is why this is a
# separate include from http/brotli.conf.

load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;
