# nginx/dev/editor.conf — compatibility note for the dev include directory.
#
# Task #241 moved the full internal editor out of the public image. Task #1270
# later introduced a separate player-only Hero Forge build and restored the
# base /editor/ route in nginx/nginx.conf. A dev image built with
# GGD_INCLUDE_EDITOR=1 replaces the player bundle with the full internal bundle
# and serves it through that same base route.
#
# This file deliberately declares no location. Defining /editor/ here as well
# would make `nginx -t` fail with a duplicate location whenever nginx/dev/ is
# mounted for /content-api/.
