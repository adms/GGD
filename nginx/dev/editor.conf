# nginx/dev/editor.conf — DEV-ONLY route (mounted at /etc/nginx/ggd-dev/).
#
# Task #241. `/editor/` used to live in nginx/nginx.conf, i.e. in EVERY deploy,
# serving apps/editor/dist as plain static with NO authentication. On a family
# deploy that meant anyone who typed https://<host>/editor/ got the whole
# content-authoring console — collection lists, the schema-derived form for
# every champion / ability / item, the 鑄技工坊 template gallery, the 3D model
# and VFX inspectors, and the AI-icon / AI-fill controls. Nothing asked who they
# were.
#
# WHY THE FIX IS "NOT PRESENT" RATHER THAN "LOGGED IN"
# ----------------------------------------------------
# 1. The editor is USELESS in production anyway. Its only backend is the
#    dev-only content-api, whose route is deliberately absent from prod
#    (content-api.conf, next to this file), and apps/editor/src/api/client.ts
#    dead-folds WRITES_ENABLED to false in a `vite build`. So the surface was
#    100% non-functional and 100% visible. Authenticating a console that cannot
#    do anything would be ceremony, not security.
# 2. Adding a session check at the EDGE would mean an auth_request subrequest
#    into the Go platform for a static tree — new machinery, a new failure mode
#    on every page load, and a second place where "who is an admin?" is decided.
#    The admin console's own answer to that question (loopback = admin, plus a
#    real session otherwise) stays exactly where it is. Nothing here touches it.
# 3. It is explicitly NOT an environment/IP gate. The owner retired that whole
#    approach on 2026-07-26 (#239) after choosing full openness, and a
#    $remote_addr rule would be wrong here regardless: this edge sits behind
#    Caddy, so $remote_addr is the proxy, not the visitor.
#
# The matching half is docker/edge.Dockerfile's GGD_INCLUDE_EDITOR build arg
# (default 0), which keeps the BYTES out of the image too. Both halves are
# needed: this location without the files serves 404s, the files without this
# location are unreachable. An image built with GGD_INCLUDE_EDITOR=1 and this
# directory mounted is a dev/LAN image and must not be published.
#
# The supported authoring flow remains `pnpm dev:editor` on the host: vite on
# 127.0.0.1:5174 with its own /content-api proxy, where the content-api's
# loopback-peer check actually passes.

location = /editor { return 301 /editor/; }

location /editor/ {
    root /usr/share/nginx/html;
    gzip_static on;   # baked sidecars — see the scope note on `location /`
    try_files $uri $uri/ /editor/index.html;
}
