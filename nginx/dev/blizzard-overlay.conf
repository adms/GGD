# nginx/dev/blizzard-overlay.conf — DEV-ONLY route (mounted at /etc/nginx/ggd-dev/).
#
# COPYRIGHT GATE (content/assets/blizzard-local/README.md): the extracted
# Warcraft III models/soundsets are Blizzard-owned and LOCAL DEV ONLY. They are
# written to the git-ignored runtime store data/blizzard-overlay/ — deliberately
# OUTSIDE the deployable content/ tree — so that no build, image or chart can
# pick them up by accident.
#
# This file is the OPTIONAL nginx-parity counterpart of the vite dev middleware
# (`serveBlizzardOverlay()` in apps/client/vite.config.ts): it maps the same
# stable URL prefix onto that store, for developers who run the client through
# the edge container instead of `pnpm --filter client dev`.
#
# WHY PROD CANNOT SERVE THIS (exclusion by construction, not by filter):
#   1. docker/edge.Dockerfile never COPYs nginx/dev/ — this location block is
#      simply not present in the image. The base config's
#      `include /etc/nginx/ggd-dev/*.conf;` glob matches nothing in prod.
#   2. Even if the block existed, /srv/blizzard-overlay is only populated by an
#      explicit read-only bind mount of ./data/blizzard-overlay, which no
#      production compose file / Helm chart declares (nothing ever mounts data/
#      into the edge — the prod edge mounts only content/ at /srv/content).
#      Unmounted, `alias` resolves nothing and every URL here 404s.
#   3. The chart's dev ConfigMap (deploy/helm/ggd/templates/edge-configmap.yaml)
#      ships ONLY content-api.conf; this file is intentionally NOT synced into
#      deploy/helm/ggd/files/ by `make helm-sync-nginx`.
#
# To use it locally (both mounts are required):
#   docker run --rm -p 8088:8080 \
#     -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
#     -v "$PWD/nginx/dev:/etc/nginx/ggd-dev:ro" \
#     -v "$PWD/content:/srv/content:ro" \
#     -v "$PWD/data/blizzard-overlay:/srv/blizzard-overlay:ro" \
#     nginxinc/nginx-unprivileged:alpine
#
# A 404 here is a SUPPORTED state: both overlay consumers (the champion model
# resolver in apps/client/src/render/views/blizzardOverlay.ts and the champion
# voice fallback in apps/client/src/audio/championVoice.ts) treat the overlay as
# optional and keep their shipped/procedural behavior.

# Longer prefix than /content/ → wins over the /srv/content location for these
# URLs regardless of file order (nginx longest-prefix match).
location /content/assets/blizzard-local/ {
    # ENVIRONMENT-TIER GATE (task #127): even where this dev/LAN overlay IS
    # mounted, refuse the Blizzard-owned assets to a genuinely public peer.
    # $ggd_deny_copyright is defined by the geo/map in the base nginx.conf that
    # includes this file (loopback + LAN → 0/serve, public → 1/deny). This file
    # is only ever loaded via that base config, so the variable always exists.
    if ($ggd_deny_copyright) { return 403; }
    alias /srv/blizzard-overlay/;
    # Local-only assets: never cache, never index, never hand to a crawler.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    types {
        application/json  json;
        model/gltf-binary glb;
        audio/wav         wav;
    }
    default_type application/octet-stream;
    # No autoindex: the directory listing is not a browsable asset library.
    # (A plain `alias` already 404s a missing file; no try_files — its
    # interaction with `alias` is a long-standing nginx footgun.)
    autoindex off;
}
