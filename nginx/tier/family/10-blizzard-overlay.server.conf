# nginx/tier/family/10-blizzard-overlay.server.conf — the family tier's half of
# the overlay route (#176). Included at server level by nginx.conf's
# `include /etc/nginx/ggd-tier/*.server.conf;`.
#
# This is the same location nginx/dev/blizzard-overlay.conf provides for local
# development, restated here because the two are mounted at different paths and
# for different reasons:
#
#   nginx/dev/   → /etc/nginx/ggd-dev/    developer running the edge locally
#   nginx/tier/family/ → /etc/nginx/ggd-tier/  a declared family deploy
#
# They are mutually exclusive in practice (a family deploy does not mount the
# dev directory); if both were mounted nginx would reject the duplicate
# location, loudly, at startup — which is the correct outcome for a
# contradictory configuration.
#
# THE BYTES. /srv/blizzard-overlay is a read-only bind mount of
# data/blizzard-overlay (556 files / 87,403,869 B: 511 .wav soundset clips, 40
# unit .glb, 5 manifest/report .json). That tree is gitignored (`/data/**`), so
# it CANNOT reach a host through git — see tools/deploy/ggd-assets.sh and
# `make family-ship`. A missing or short mount is NOT tolerated on this tier:
# the edge runs the boot assertion before nginx starts and refuses to come up,
# because the alternative is 40 of 113 champions silently rendering as one of
# four generic stand-ins with no voice while everything looks healthy.
#
# Longer prefix than /content/ → wins over the /srv/content location for these
# URLs regardless of file order (nginx longest-prefix match).
location /content/assets/blizzard-local/ {
    # NO PER-PEER GATE. There used to be an `if ($ggd_deny_copyright) { return
    # 403; }` here, as a fail-safe for someone mounting this file without
    # 00-full-assets.geo.conf. The deny variable was deleted on 2026-07-26 by
    # explicit owner decision (#239) — see nginx/nginx.conf's $ggd_env_tier
    # block and docs/copyright-content-gate.md. Re-adding the `if` without
    # re-adding the map would make this file reference an undefined variable,
    # and nginx would REFUSE TO START on the family host (`unknown
    # "ggd_deny_copyright" variable`) — which `nginx -t` against nginx.conf
    # alone, the check infracheck runs, does not catch, because these fragments
    # are not part of that file.
    alias /srv/blizzard-overlay/;
    # ---- CACHING: `?h=`-keyed, exactly like every other content asset (#177) --
    # NOT `no-store`, which is what nginx/dev/blizzard-overlay.conf uses and what
    # this file was first copied from. That is right for a dev box serving one
    # developer and wrong here: it makes every family member re-download up to
    # 84 MB EVERY visit — 40 unit .glb (40.1 MB) plus whichever soundset .wav a
    # match touches — on a home uplink, before they can play.
    #
    # These URLs already carry the cache key. Both consumers stamp it:
    #   apps/client/src/render/AssetManager.ts    → withContentVersion(url)
    #   apps/client/src/audio/AudioSystem.ts      → urlFor()
    # so a model request arrives as
    #   /content/assets/blizzard-local/models/E00R.glb?h=cv_<contentVersion>
    # and `map $arg_h $content_cache` (nginx.conf) turns that into
    # `public, max-age=31536000, immutable`. Identical policy to the imported
    # champion GLBs one location above — the overlay was the only asset class
    # left revalidating.
    #
    # MANIFEST.json is fetched BARE by both probes (no stamp), so it lands in the
    # `""` row of that map and stays `no-cache`. That is the correct split: the
    # index revalidates on every boot, the hash-addressed bytes it points at do
    # not. Re-run `content:build` for an asset swap — see content/assetVersion.ts
    # for the residual risk that key carries.
    add_header Cache-Control $content_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    types {
        application/json  json;
        model/gltf-binary glb;
        audio/wav         wav;
    }
    default_type application/octet-stream;
    # No autoindex: the directory listing is not a browsable asset library.
    autoindex off;
}
