# nginx/tier/family/00-full-assets.geo.conf — THE FAMILY TIER SWITCH (#176).
#
# Included INSIDE the `geo $ggd_env_tier` block of nginx/nginx.conf, via
# `include /etc/nginx/ggd-tier/*.geo.conf;`. Mounting the directory this file
# lives in over /etc/nginx/ggd-tier/ is the single act that turns a gated edge
# into a full-asset edge.
#
# WHAT IT DOES. It adds a catch-all route to the address→tier radix tree:
# every peer that is not already matched by a more specific prefix is
# classified `lan` instead of `public`. `$ggd_deny_copyright` is `map`ped from
# that value (public → 1, anything else → 0), so the two gated mounts
#
#     /content/assets/models/imported/     129 anime/imported champion GLBs
#     /content/assets/blizzard-local/      the 556-file WC3 overlay
#
# are served to EVERY peer, including a relative arriving over a tunnel or from
# a public IP. That is the owner's explicit instruction for this build:
# 「我只找家人玩，不用分級，請全開資源」.
#
# WHY A CATCH-ALL PREFIX AND NOT A REWRITTEN MAP. nginx refuses a duplicate
# `map` for the same variable, so overriding $ggd_deny_copyright would require
# moving its definition out of nginx.conf into a file that must then always be
# present — and nginx.conf would stop being valid on its own, which the
# infracheck suite (`nginx -t` against exactly that one file) depends on. A geo
# `include` is additive: absent, nothing changes; present, it changes one
# default. More-specific prefixes are unaffected, so 127.0.0.0/8 is still
# `loopback` and 192.168.0.0/16 is still `lan`.
#
# THE HONEST CAVEAT. This is a deliberate widening of a copyright gate, for a
# deploy the owner has stated is family-only and never public. It is scoped to
# a file that must be explicitly mounted, so it cannot be reached by accident,
# and the platform logs `deployTier=family` at boot so the widening is never
# silent.

0.0.0.0/0  lan;
::/0       lan;
