# nginx/tier/family/00-full-assets.geo.conf — THE FULL-ASSET DECLARATION (#176).
#
# DO NOT DELETE THIS FILE, even though it no longer decides who gets served.
# tools/deploy/ggd-assets.sh keys the entire full-asset integrity check on this
# file's PRESENCE at /etc/nginx/ggd-tier/00-full-assets.geo.conf; without it the
# assert prints "tier=gated — no full-asset assertion" and exits 0. A partial or
# corrupt upload of the 556-file / 87,403,869 B overlay would then boot happily
# and 40 of 113 champions would silently render as generic stand-ins with no
# voice — the exact failure #176 exists to remove. It looks like pure copyright
# machinery. It is not.
#
# Included INSIDE the `geo $ggd_env_tier` block of nginx/nginx.conf, via
# `include /etc/nginx/ggd-tier/*.geo.conf;`. Mounting the directory this file
# lives in over /etc/nginx/ggd-tier/ is what declares a full-asset edge — and,
# through the *.server.conf sibling, what actually adds the blizzard-local
# route. That route is still the reason the mount matters.
#
# WHAT IT USED TO DO, AND NO LONGER DOES. It classified every otherwise
# unmatched peer as `lan` rather than `public`, so that `$ggd_deny_copyright`
# (public → 1) would not 403 the imported champion GLBs and the WC3 overlay.
# That deny variable was DELETED on 2026-07-26 (#239) by explicit owner
# decision, taken in full knowledge that /content/assets/** checks no session:
# 「照你原本說的，全部公開不擋」. The gate had never actually fired in
# production anyway — Caddy reverse-proxies the edge, so $remote_addr is always
# a 172.16/12 container address and the classification was always `lan`. These
# rows therefore still classify, but nothing reads the classification.
#
# WHY TWO HALVES OF /0 AND NOT `0.0.0.0/0`. A /0 row is the same network as
# geo's own `default`, so nginx emits a duplicate-network warning and which one
# wins depends on where the include lands in the block — an invisible ordering
# trap. `0.0.0.0/1` + `128.0.0.0/1` (and `::/1` + `8000::/1`) cover exactly the
# same address space with strictly longer prefixes, so they beat `default` by
# the radix rule and lose to every specific row above them, whatever the order.
# 127.0.0.0/8 is still `loopback`; 192.168.0.0/16 is still `lan`.

0.0.0.0/1    lan;
128.0.0.0/1  lan;
::/1         lan;
8000::/1     lan;
