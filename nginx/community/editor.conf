# Explicit community opt-in: static authoring UI with authenticated Platform
# draft/build/submit APIs. Production content CRUD stays disabled; the private
# content-api is neither mounted nor proxied by this fragment.
# Pair with GGD_INCLUDE_EDITOR=1 through docker/compose.community.yaml.
location = /editor { return 301 /editor/; }

location /editor/ {
    root /usr/share/nginx/html;
    gzip_static on;
    try_files $uri $uri/ /editor/index.html;
}
