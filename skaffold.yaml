# skaffold.yaml — one-click build+deploy of the GGD stack.
#
#   skaffold run -p local    # build all images into kind + helm install (make up)
#   skaffold dev -p local    # watch/rebuild/redeploy inner loop      (make dev)
#   skaffold build -p ci     # CI image build only
#
# CONTRACT NOTE: the game/edge/content-api images build apps that are being
# developed in parallel (apps/game-server, apps/client, apps/editor,
# apps/content-api). Until those packages land, their docker builds fail —
# platform + redis + testrunner already build. See docker/*.Dockerfile headers.
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: ggd

build:
  local:
    useBuildkit: true
    push: false            # kind: images are side-loaded, not pushed
  artifacts:
    - image: ggd-platform
      context: .
      docker:
        dockerfile: docker/platform.Dockerfile
    - image: ggd-game
      context: .
      docker:
        dockerfile: docker/game.Dockerfile
    - image: ggd-edge
      context: .
      docker:
        dockerfile: docker/edge.Dockerfile
    - image: ggd-content-api
      context: .
      docker:
        dockerfile: docker/content-api.Dockerfile
    - image: ggd-testrunner
      context: .
      docker:
        dockerfile: docker/testrunner.Dockerfile

profiles:
  # ---- one-click local: kind + helm with the local values -------------------
  - name: local
    deploy:
      helm:
        releases:
          - name: ggd
            chartPath: deploy/helm/ggd
            valuesFiles:
              - deploy/helm/ggd/values-local.yaml
              # generated by `make secrets` (gitignored); create it before
              # `skaffold run -p local` — `make up` does this for you
              - deploy/helm/secrets.local.yaml
            setValueTemplates:
              platform.image: "{{.IMAGE_FULLY_QUALIFIED_ggd_platform}}"
              game.image: "{{.IMAGE_FULLY_QUALIFIED_ggd_game}}"
              edge.image: "{{.IMAGE_FULLY_QUALIFIED_ggd_edge}}"
    portForward:
      - resourceType: service
        resourceName: ggd-edge
        port: 8080
        localPort: 8080

  # ---- CI: build images only (deploy exercised by kind e2e job later) -------
  - name: ci
    build:
      local:
        useBuildkit: true
        push: false
    # no deploy stanza: `skaffold build -p ci`
