{{- /*
One K8s Secret consumed via envFrom by platform + game (+ content-api in
dev). Values are injected at deploy time (make up generates
deploy/helm/secrets.local.yaml with openssl rand); images NEVER contain
secrets (infra-09). For real clusters, prefer --set-file / external secret
managers; this template also allows secrets.create=false to bring your own.
*/ -}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "ggd.labels" . | nindent 4 }}
type: Opaque
stringData:
  # No weak defaults: an unset secret must FAIL the render, never silently ship a
  # guessable value. `make up` generates strong values (openssl rand) into
  # deploy/helm/secrets.local.yaml; real clusters pass --set / --set-file / an
  # external secret manager. values-local.yaml carries dev-only fallbacks so the
  # local kind profile still renders.
  JWT_SIGNING_SECRET: {{ required "secrets.jwtSigningSecret must be set (run `make up` to generate it, or pass --set secrets.jwtSigningSecret=...)" .Values.secrets.jwtSigningSecret | quote }}
  PLATFORM_GAME_SHARED_SECRET: {{ required "secrets.platformGameSharedSecret must be set (run `make up` to generate it, or pass --set secrets.platformGameSharedSecret=...)" .Values.secrets.platformGameSharedSecret | quote }}
  REDIS_PASSWORD: {{ required "secrets.redisPassword must be set (run `make up` to generate it, or pass --set secrets.redisPassword=...)" .Values.secrets.redisPassword | quote }}
{{- end }}
