# Edge nginx config as a ConfigMap so config tweaks don't require an image
# rebuild. files/nginx.conf is a synced copy of nginx/nginx.conf (source of
# truth — `make helm-sync-nginx` refreshes the copies; CI's infracheck test
# fails if they drift).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-edge-nginx
  labels:
    {{- include "ggd.labels" . | nindent 4 }}
    app.kubernetes.io/name: edge
data:
  nginx.conf: |
{{ .Files.Get "files/nginx.conf" | indent 4 }}
{{- if .Values.dev.enabled }}
---
# DEV ONLY: the /content-api/ route (synced copy of nginx/dev/content-api.conf).
# Mounted into /etc/nginx/ggd-dev/ — the base config's glob include picks it
# up. Absent in prod ⇒ the route does not exist there (infra-05).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-edge-dev
  labels:
    {{- include "ggd.labels" . | nindent 4 }}
    app.kubernetes.io/name: edge
data:
  content-api.conf: |
{{ .Files.Get "files/content-api.dev.conf" | indent 4 }}
{{- end }}
