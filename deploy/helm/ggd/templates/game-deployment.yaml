# Colyseus game server. Single replica for now (WS stickiness by construction);
# the Service adds sessionAffinity: ClientIP so a future multi-replica rollout
# keeps clients pinned (plan "Key risks — WS sticky sessions").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-game
  labels:
    {{- include "ggd.labels" . | nindent 4 }}
    app.kubernetes.io/name: game
spec:
  replicas: {{ .Values.game.replicas }}
  selector:
    matchLabels:
      {{- include "ggd.selector" (dict "root" . "name" "game") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ggd.labels" . | nindent 8 }}
        {{- include "ggd.selector" (dict "root" . "name" "game") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: game
          image: {{ .Values.game.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: ws
              containerPort: {{ .Values.game.port }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secrets
          env:
            - name: PORT
              value: {{ .Values.game.port | quote }}
            # ⭐⭐ GH#813 C —— **rollback 開關必須在線上轉得到**。
            #
            # ⚠️ 2026-08-31 量到：compose 有 **74** 個 env key 是 helm 轉不到的，
            #   ⭐ 而其中 **6 個是 `*_ENABLED` / `*_BYPASS` 形狀的 rollback 開關**
            #   ⇒ ⛔ 它們存在的理由就是「線上出事時一鍵回頭」，
            #     而在線上轉不到**等於沒有**（第一守則：留開關的成本必須是改一格）。
            #
            # ⭐ `with` ＋ `default` ⇒ 沒設就**不送這個 env**（⛔ 不是送一個空字串）：
            #   容器那一側的預設值仍然是唯一的住處（第〇·四守則）。
            {{- range $k, $v := .Values.game.rollbackEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          # CONTRACT: apps/game-server is in flight; a /healthz HTTP route is
          # planned but not guaranteed yet, so probe the WS port itself.
          readinessProbe:
            tcpSocket:
              port: ws
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: ws
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- with .Values.game.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: content
              mountPath: /srv/content
              readOnly: true
      volumes:
        - name: content
          {{- if .Values.content.hostPath }}
          hostPath:
            path: {{ .Values.content.hostPath | quote }}
            type: Directory
          {{- else if .Values.content.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.content.existingClaim | quote }}
            readOnly: true
          {{- else }}
          emptyDir: {}
          {{- end }}
