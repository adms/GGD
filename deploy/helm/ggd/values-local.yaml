# deploy/helm/ggd/values-local.yaml — one-click local profile (kind + skaffold).
#
# deploy/kind/kind-config.yaml mounts the repo's ./content (RO) and ./data (RW)
# into the kind node at /ggd/content and /ggd/data; the hostPath values below
# make host-edited JSON live inside the cluster and persist data/ across
# restarts (backup = cp -r ./data).

appEnv: development

platform:
  data:
    hostPath: /ggd/data

content:
  hostPath: /ggd/content

dev:
  enabled: true           # content-api + edge /content-api/ route

test:
  enabled: false          # flip on to run the test dashboard in-cluster

seed:
  enabled: true
  # LOCAL ONLY: a `make up` box should be immediately playable. Still a no-op
  # once anything is curated, so it never fights an operator's edits.
  starterWhitelist: true

ingress:
  enabled: false          # local access = `make up` port-forward

# Secrets are NOT carried here as working literals anymore (#176). They used to
# be `dev-insecure-jwt-secret` / `-seam-secret` / `-redis-password` — real,
# usable values sitting in a tracked file, which is exactly what a deployed
# process must never be able to read. They are now blank, so secret.yaml's Helm
# `required` FAILS FAST on any render that does not supply them, the same
# fail-closed direction as values.yaml. `make up` supplies generated values via
# deploy/helm/secrets.local.yaml (gitignored); the infracheck suite supplies
# dummy `--set` values. And even if a blank slipped through, the platform's own
# boot guard rejects these three names as known dev values
# (apps/platform/internal/config, packages/shared/src/deploySecrets.ts).
secrets:
  create: true
  jwtSigningSecret: ""
  platformGameSharedSecret: ""
  redisPassword: ""
