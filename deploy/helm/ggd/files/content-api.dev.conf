# nginx/dev/content-api.conf — DEV-ONLY route (mounted at /etc/nginx/ggd-dev/).
#
# The Fastify content-api (apps/content-api, :8787) performs content CRUD +
# validation + SSE hot-reload and MUST NOT be reachable in production
# (plan §2: "Prod = static JSON via Nginx/CDN, content-api not deployed").
# This file is only mounted when the Helm value dev.enabled=true (or in the
# docker compose dev profile); the base nginx.conf includes
# /etc/nginx/ggd-dev/*.conf which matches nothing in prod.
#
# NOTE: the upstream hostname resolves at config load — that is safe here
# because this file is only ever loaded in profiles that deploy content-api.
#
# KNOWN, DELIBERATE CONSEQUENCE (task #96). The content-api only accepts a
# MUTATING request whose PEER is loopback, read off the socket — it ignores the
# X-Real-IP / X-Forwarded-For headers set below, because a header is written by
# whoever is calling and trusting one here would hand write access to every
# device on the LAN. Behind this proxy the peer is the container-network address
# of nginx, so:
#
#     reads through this route work; WRITES THROUGH THIS ROUTE RETURN 403.
#
# That is the correct trade, not a bug to work around. The supported authoring
# flow is `pnpm dev:editor` / `pnpm dev:all` on the host: vite proxies
# /content-api to 127.0.0.1:8787, so the peer really is loopback. Do NOT add a
# trusted-proxy CIDR here — that is a hole with a comment on it.

location /content-api/ {
    # trailing slash strips the /content-api prefix
    proxy_pass http://content-api:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE (/content-api/events hot-reload stream)
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
