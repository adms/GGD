<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>去死團的逆襲 · 動漫亂鬥競技場</title>
    <!-- PWA (iOS home-screen; NO service worker yet — offline cache is future work) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="180x180" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GGD" />
    <meta name="theme-color" content="#0b0e14" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0e14;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      #game-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }
      #hud-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      #anchor-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="anchor-layer"></div>
    <div id="hud-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
