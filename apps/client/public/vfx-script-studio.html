<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>特效工坊 · 演出腳本 Studio（GH#838）</title>
<style>
  :root { --bg:#05060a; --panel:#12161f; --line:#2a3145; --fg:#e8ecf6; --dim:#98a2bd;
          --accent:#7dc4fc; --gold:#f0c674; --err:#ff7a7a; --ok:#8fe38f; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--fg); overflow:hidden; display:flex; flex-direction:column;
         font:13px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans TC",sans-serif; }
  header { display:flex; gap:8px; align-items:center; padding:8px 10px; background:var(--panel);
           border-bottom:1px solid var(--line); flex:0 0 auto; }
  header h1 { font-size:14px; margin:0 8px 0 0; color:var(--gold); white-space:nowrap; }
  header input[type=text] { background:#0b0e15; color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:5px 8px; width:190px; }
  button { background:#1b2231; color:var(--fg); border:1px solid var(--line); border-radius:6px;
           padding:5px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:#20406a; border-color:#3a6ea5; }
  #status { margin-left:auto; color:var(--dim); font-size:12px; max-width:40%; overflow:hidden;
            text-overflow:ellipsis; white-space:nowrap; }
  #status[data-tone=ok] { color:var(--ok); } #status[data-tone=err] { color:var(--err); }
  main { flex:1 1 auto; display:flex; min-height:0; }
  /* 左：資源面板 */
  #palette { flex:0 0 250px; display:flex; flex-direction:column; background:var(--panel);
             border-right:1px solid var(--line); min-height:0; }
  #palette .tabs { display:flex; }
  #palette .tabs button { flex:1; border-radius:0; border:none; border-bottom:2px solid transparent; }
  #palette .tabs button.active { border-bottom-color:var(--accent); color:var(--accent); }
  #palette input { margin:8px; background:#0b0e15; color:var(--fg); border:1px solid var(--line);
                   border-radius:6px; padding:5px 8px; }
  #res-list { flex:1; overflow:auto; padding:0 8px 8px; }
  .res { padding:5px 8px; margin-bottom:4px; background:#0b0e15; border:1px solid var(--line);
         border-radius:6px; cursor:grab; font-size:12px; word-break:break-all; }
  .res:hover { border-color:var(--accent); }
  .res small { color:var(--dim); display:block; }
  #palette .hint { padding:6px 10px; color:var(--dim); font-size:11.5px; border-top:1px solid var(--line); }
  /* 中：畫布 */
  #stage { flex:1 1 auto; position:relative; min-width:0; }
  #view { position:absolute; inset:0; width:100%; height:100%; display:block; outline:none; }
  #drop-hint { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
               background:rgba(125,196,252,.08); border:2px dashed var(--accent); pointer-events:none;
               font-size:16px; color:var(--accent); }
  #stage.dragover #drop-hint { display:flex; }
  /* 右：檢視器 */
  #inspector { flex:0 0 320px; display:flex; flex-direction:column; background:var(--panel);
               border-left:1px solid var(--line); min-height:0; overflow:auto; }
  #segments { padding:8px; border-bottom:1px solid var(--line); }
  #segments h2, #sliders h2, #advanced h2 { font-size:12px; color:var(--dim); margin:0 0 6px;
               text-transform:none; }
  .chip { display:flex; gap:6px; align-items:center; padding:4px 8px; margin-bottom:4px;
          background:#0b0e15; border:1px solid var(--line); border-radius:6px; cursor:pointer;
          font-size:12px; }
  .chip.sel { border-color:var(--gold); }
  .chip .kind { color:var(--accent); }
  .chip .t { color:var(--dim); margin-left:auto; }
  .chip .del { color:var(--err); cursor:pointer; padding:0 2px; }
  #sliders { padding:8px; border-bottom:1px solid var(--line); }
  .field { display:grid; grid-template-columns: 96px 1fr 56px; gap:6px; align-items:center;
           margin-bottom:6px; }
  .field label { color:var(--dim); font-size:11.5px; }
  .field input[type=range] { width:100%; }
  .field input[type=number], .field input[type=text], .field select {
    width:100%; background:#0b0e15; color:var(--fg); border:1px solid var(--line);
    border-radius:4px; padding:3px 5px; font-size:11.5px; }
  .field input[type=color] { width:100%; height:24px; padding:0; border:1px solid var(--line);
    background:#0b0e15; }
  .field .val { color:var(--gold); font-size:11.5px; text-align:right; }
  #advanced { padding:8px; }
  #editor { width:100%; height:220px; background:#0b0e15; color:var(--fg);
            border:1px solid var(--line); border-radius:6px; font:11.5px/1.45 ui-monospace,Menlo,monospace;
            padding:8px; resize:vertical; }
  #issues { white-space:pre-wrap; color:var(--err); font-size:11.5px; margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1>🎨 特效工坊 · 演出腳本</h1>
  <input id="ability" type="text" list="script-ids" placeholder="abilityId（如 godie-h020.e）">
  <datalist id="script-ids"></datalist>
  <button id="btn-reload" title="換一支技能（重載頁面）">切換技能</button>
  <button id="btn-load">重讀檔案</button>
  <button id="btn-cast" class="primary">▶ 施放（全程觀看）</button>
  <button id="btn-save" class="primary">💾 存檔</button>
  <button id="btn-publish" title="content:build → git commit（只含 vfx-scripts＋產物）→ push">⬆️ 回存主線</button>
  <span id="status">啟動中…</span>
</header>
<main>
  <aside id="palette">
    <div class="tabs">
      <button id="tab-models" class="active">模型</button>
      <button id="tab-vfx">粒子特效</button>
    </div>
    <input id="res-filter" type="text" placeholder="搜尋資源 id…">
    <div id="res-list"></div>
    <div class="hint">⭐ 把資源<strong>拖進畫面</strong>＝在落點加一段演出（落點會換算成相對施法者的前後/左右位移）。點選右側段落用 slider 微調。</div>
  </aside>
  <section id="stage">
    <canvas id="view"></canvas>
    <div id="drop-hint">放開＝在這裡加一段</div>
  </section>
  <aside id="inspector">
    <div id="segments"><h2>段落（按觸發＋時間排序；點選＝編輯，✕＝刪除）</h2><div id="chips"></div></div>
    <div id="sliders"><h2>參數（拖 slider 即時重放全程）</h2><div id="fields"><em style="color:var(--dim)">（先選一段）</em></div></div>
    <div id="advanced"><h2>進階：原始 JSON（改完按「套用」）</h2>
      <textarea id="editor" spellcheck="false"></textarea>
      <div style="display:flex;gap:6px;margin-top:6px">
        <button id="btn-apply-json">套用 JSON</button>
        <button id="btn-validate">只驗證</button>
      </div>
      <div id="issues"></div>
    </div>
  </aside>
</main>
<script type="module" src="/src/vfx/vfxScriptStudio.ts"></script>
</body>
</html>
