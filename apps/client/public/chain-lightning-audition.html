<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>連鎖閃電確認 — 飛鼠先生 65-04 天譴 × 10 個敵人</title>
<style>
  :root { --bg:#05060a; --panel:#12161f; --line:#2a3145; --fg:#e8ecf6; --dim:#98a2bd;
          --accent:#7dd3fc; --gold:#f0c674; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--fg); overflow:hidden;
         font:14px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans TC",sans-serif; }
  #view { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hud { position:fixed; z-index:2; background:rgba(14,18,28,.9); border:1px solid var(--line);
         border-radius:10px; padding:12px 14px; }
  #panel { top:14px; left:14px; max-width:420px; }
  #panel h1 { margin:0 0 4px; font-size:16px; }
  #panel p { margin:6px 0 0; color:var(--dim); font-size:12.5px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }
  button { font:inherit; font-size:12.5px; color:var(--fg); background:#1d2334;
           border:1px solid var(--line); border-radius:7px; padding:5px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  #stats { bottom:14px; left:14px; right:14px; font-variant-numeric:tabular-nums;
           color:var(--gold); font-size:13px; }
  #err { top:14px; left:14px; right:14px; max-width:700px; border-color:#7f2d2d;
         background:#2a1212; display:none; }
  code { background:#0009; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="err" class="hud"><h1>載入失敗</h1><p id="errmsg"></p>
  <p>這頁只在 <code>vite dev</code> 下可用。</p></div>

<div id="panel" class="hud">
  <h1>連鎖閃電確認 <span style="color:var(--dim);font-size:12px">65-04 天譴</span></h1>
  <p>飛鼠先生在中心，<b>10 個敵人</b>在半徑 6 的環上。⭐ 真的 <code>SimWorld</code> →
     真的出貨技能 → 真的 <code>chainLightning</code> 事件 → 真的
     <code>VfxSystem.handleEvent</code> → 真的 <code>ArcBoltFx</code>。
     ⛔ 沒有任何一段是這一頁自己造的。</p>
  <div class="row">
    <button id="cast">⚡ 施放天譴</button>
    <button id="s1">+1 tick</button>
    <button id="s3">+3 tick</button>
    <button id="s10">+10 tick</button>
  </div>
</div>

<div id="stats" class="hud"><span id="readout">—</span></div>

<script type="module">
const showErr = (m) => {
  document.getElementById("errmsg").textContent = String(m);
  document.getElementById("err").style.display = "block";
};
window.addEventListener("error", (e) => showErr(e.message));
window.addEventListener("unhandledrejection", (e) => showErr(e.reason));

try {
  const { startChainLightningAudition } = await import("/src/vfx/chainLightningAudition.ts");
  const h = await startChainLightningAudition(document.getElementById("view"), 10);
  window.__arc = h; // 截圖自動化接縫

  const readout = document.getElementById("readout");
  const paint = () => {
    const s = h.stats();
    readout.textContent =
      `tick ${s.tick} · 敵人 ${s.enemies} · sim 發出 chainLightning ${s.emitted} 則` +
      ` · 畫面上正在發光的弧 ${s.arcsActive} 條 · 累計畫了 ${s.arcsDrawn} 條`;
  };
  paint();

  document.getElementById("cast").onclick = async () => { await h.cast(); paint(); };
  document.getElementById("s1").onclick = () => { h.step(1); paint(); };
  document.getElementById("s3").onclick = () => { h.step(3); paint(); };
  document.getElementById("s10").onclick = () => { h.step(10); paint(); };
} catch (e) { showErr(e && e.stack ? e.stack : e); }
</script>
</body>
</html>
