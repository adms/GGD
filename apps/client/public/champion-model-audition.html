<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>英雄模型確認台 — 真戰鬥鏡頭 / 真選角預覽 (#267)</title>
<style>
  :root { --bg:#07080c; --panel:#12161f; --line:#2a3145; --fg:#e8ecf6; --dim:#98a2bd; --accent:#7dd3fc; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--fg); overflow:hidden;
         font:14px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans TC",sans-serif; }
  #view { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .hud { position:fixed; z-index:2; background:rgba(14,18,28,.88); border:1px solid var(--line);
         border-radius:10px; padding:12px 14px; backdrop-filter:blur(6px); }
  #panel { top:14px; left:14px; max-width:420px; }
  #panel h1 { margin:0 0 4px; font-size:15px; }
  #panel p { margin:6px 0 0; color:var(--dim); font-size:12px; }
  #stats { bottom:14px; left:14px; right:14px; font-variant-numeric:tabular-nums;
           color:var(--dim); font-size:12px; white-space:pre-wrap; }
  #err { top:14px; left:14px; right:14px; max-width:680px; border-color:#7f2d2d;
         background:#2a1212; display:none; }
  code { background:#0009; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="err" class="hud"></div>
<div id="panel" class="hud">
  <h1>英雄模型確認台 · 真鏡頭 / 真預覽</h1>
  <p>
    <code>?model=imported.goku</code> ·
    <code>&amp;cam=combat</code>（真 <code>CameraRig</code>：68°、dolly 10、fov 0.8、真地板）
    或 <code>&amp;cam=select</code>（真 <code>StorePreview</code>，就是選角側欄與商店掛的那一顆）·
    <code>&amp;clip=idle</code> · <code>&amp;step=600</code> · <code>&amp;hud=0</code>
  </p>
  <p>
    <code>headroomAboveHeadJoint</code> 是這頁的重點：骨架說「頭在這裡」，
    網格的最高點卻在它下面，就是 #267 的形狀。
  </p>
</div>
<div id="stats" class="hud"></div>

<script type="module">
  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) ? Number(q.get(k)) : d);
  const err = document.getElementById("err");
  const stats = document.getElementById("stats");
  const canvas = document.getElementById("view");
  if (q.get("hud") === "0") {
    for (const el of document.querySelectorAll(".hud")) el.style.display = "none";
  }
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  try {
    const { startChampionModelAudition } = await import("/src/render/championModelAudition.ts");
    const handle = startChampionModelAudition(canvas, {
      modelKey: q.get("model") ?? "imported.goku",
      cam: q.get("cam") === "select" ? "select" : "combat",
      clip: q.get("clip") ?? "idle",
      offsetZ: num("offsetZ", 0),
    });
    handle.stepTo(num("step", 600));
    window.__audition = handle;
    Object.defineProperty(window, "__settled", { get: () => handle.settled });
    window.__probe = () => handle.probe();
    if (q.get("hud") !== "0") {
      setInterval(() => { stats.textContent = JSON.stringify(handle.probe(), null, 1); }, 250);
    }
  } catch (e) {
    err.style.display = "block";
    err.textContent = String(e && e.stack ? e.stack : e);
  }
</script>
</body>
</html>
