<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>w3x 頂點染色確認台 (#263)</title>
<style>
  :root { --bg:#07080c; --panel:#12161f; --line:#2a3145; --fg:#e8ecf6; --dim:#98a2bd;
          --accent:#7dd3fc; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--fg); overflow:hidden;
         font:14px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans TC",sans-serif; }
  #view { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .hud { position:fixed; z-index:2; background:rgba(14,18,28,.88); border:1px solid var(--line);
         border-radius:10px; padding:12px 14px; backdrop-filter:blur(6px); }
  #panel { top:14px; left:14px; max-width:420px; }
  #panel h1 { margin:0 0 4px; font-size:15px; letter-spacing:.02em; }
  #panel p { margin:6px 0 0; color:var(--dim); font-size:12px; }
  #stats { bottom:14px; left:14px; right:14px; max-height:38vh; overflow:auto;
           font-variant-numeric:tabular-nums; color:var(--dim); font-size:11px; white-space:pre-wrap; }
  #err { top:14px; left:14px; right:14px; max-width:680px; border-color:#7f2d2d;
         background:#2a1212; display:none; }
  code { background:#0009; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="err" class="hud"></div>

<div id="panel" class="hud">
  <h1>w3x 頂點染色確認台 · #263</h1>
  <p>
    真正的 <code>CameraRig</code>（68°、dolly 10、fov 0.8）＋ 真正的
    <code>buildZoneGround</code> ＋ 真正的 <code>ChampionView</code>
    （體素貼圖／glb 升級／隊伍環都在）。<strong>唯一</strong>會變的是有沒有呼叫
    <code>applyModelTint</code>。
  </p>
  <p>
    <code>?champ=godie-u00l</code> · <code>&amp;tint=on|off</code> ·
    <code>&amp;team=0..3</code> · <code>&amp;step=1200</code> ·
    <code>&amp;hud=0</code>（截圖時關掉面板）
  </p>
</div>

<div id="stats" class="hud"></div>

<script type="module">
  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) ? Number(q.get(k)) : d);
  const err = document.getElementById("err");
  const stats = document.getElementById("stats");
  const canvas = document.getElementById("view");
  if (q.get("hud") === "0") {
    for (const el of document.querySelectorAll(".hud")) el.style.display = "none";
  }
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  try {
    const { startTintAudition } = await import("/src/render/tintAudition.ts");
    const handle = startTintAudition(canvas, {
      champ: q.get("champ") ?? "godie-u00l",
      tint: q.get("tint") !== "off",
      teamId: num("team", 0),
    });
    handle.stepTo(num("step", 1200));
    window.__audition = handle;
    Object.defineProperty(window, "__settled", { get: () => handle.settled });
    window.__probe = () => handle.probe();
    if (q.get("hud") !== "0") {
      setInterval(() => {
        stats.textContent = JSON.stringify(handle.probe(), null, 1);
      }, 250);
    }
  } catch (e) {
    err.style.display = "block";
    err.textContent = String(e && e.stack ? e.stack : e);
  }
</script>
</body>
</html>
